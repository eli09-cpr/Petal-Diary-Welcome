
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Petal Diary</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#fff2f8,#f9d8e9);
 font-family:"Segoe UI",sans-serif;
 color:#a24d79;text-align:center;
 padding:24px;overflow-x:hidden;
}
.card{
 width:100%;max-width:420px;
 background:#ffffffc9;
 border:1px solid white;
 border-radius:32px;
 padding:38px 24px;
 box-shadow:0 18px 50px #c76e9b25;
}
h1{font-family:Georgia,serif;font-size:38px;margin:8px 0}
.flora{font-size:85px;margin:18px 0}
h2{font-size:22px}
p{line-height:1.7}
.petal{position:fixed;font-size:25px;opacity:.5;
 animation:fall 9s linear infinite;pointer-events:none}
.petal:nth-child(1){left:10%;animation-delay:0s}
.petal:nth-child(2){left:35%;animation-delay:3s}
.petal:nth-child(3){left:65%;animation-delay:5s}
.petal:nth-child(4){left:90%;animation-delay:1s}
@keyframes fall{
 from{top:-10%;transform:rotate(0deg)}
 to{top:110%;transform:rotate(360deg)}
}
</style>
</head>
<body>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<main class="card">
<div>🌸 ✨ 🌸</div>
<h1>Petal Diary</h1>
<p>Your little diary is ready to bloom!</p>
<div class="flora">🐩</div>
<h2>Welcome to Petal Diary!</h2>
<p>Thank you for joining our little garden.</p>
<p>If you arrived here after confirming your email,
you can return to the Petal Diary app and sign in.</p>
<p>With love and cherry blossoms 🌷</p>
</main>
</body>
</html>
